name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec biome ci .
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Prueba de humo e2e
        run: |
          pnpm --filter @ventisca/web exec playwright install --with-deps chromium
          PW_SWIFTSHADER=1 pnpm --filter @ventisca/web exec playwright test --grep-invert @lento
