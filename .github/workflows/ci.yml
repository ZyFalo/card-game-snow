name: CI

# En un pull request corre todo: lo rápido (estilo, tipos, pruebas unitarias y build), la imagen y las e2e,
# repartidas entre varias máquinas. En main, tras fusionar, corre solo lo rápido y la imagen.
#
# Las e2e no se repiten en main porque GitHub exige que la rama esté al día para fusionar (regla de main:
# `ci` y `docker` requeridas, con la rama al día): el PR ya probó exactamente el código que llega a main.
# Si esa regla se quita, las e2e tienen que volver a correr en main.
#
# Railway espera el resultado de main antes de desplegar ("Wait for CI").
on:
  push:
    branches: [main]
  pull_request:

jobs:
  rapidas:
    name: estilo, tipos, unitarias y build
    runs-on: ubuntu-latest
    # Postgres para las pruebas del servidor: cada corrida crea y borra su propia base temporal.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ventisca
          POSTGRES_PASSWORD: ventisca
          POSTGRES_DB: ventisca
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ventisca -d ventisca"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL_TEST: postgres://ventisca:ventisca@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec biome ci .
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # Un PR solo puede leer la caché que guardó main, y en main las e2e ya no corren: aquí se dejan
      # guardados sus navegadores. Si ya están, no se descarga nada.
      - name: Versión de Playwright
        if: github.event_name == 'push'
        id: playwright
        run: echo "version=$(pnpm --filter @ventisca/web exec playwright --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      - name: Navegadores de las e2e, en caché para los PRs
        if: github.event_name == 'push'
        id: navegadores
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
          lookup-only: true
      - name: Descarga los navegadores que falten
        if: github.event_name == 'push' && steps.navegadores.outputs.cache-hit != 'true'
        run: pnpm --filter @ventisca/web exec playwright install chromium

  # Las e2e levantan el servidor de verdad, con su propia base en el Postgres del servicio. Van repartidas
  # entre tres máquinas: `scripts/e2e-reparto.mjs` le da a cada una sus archivos, equilibrados por lo que
  # tardan. Más máquinas no acortan la CI: la más lenta ya tarda lo que su archivo más pesado, cuyas pruebas
  # van una tras otra. Solo corren en los pull requests (ver arriba).
  e2e:
    name: e2e (${{ matrix.maquina }}/${{ strategy.job-total }})
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        maquina: [1, 2, 3]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ventisca
          POSTGRES_PASSWORD: ventisca
          POSTGRES_DB: ventisca
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ventisca -d ventisca"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL_TEST: postgres://ventisca:ventisca@localhost:5432/postgres
      # Sin tarjeta gráfica: el tablero se dibuja por software.
      PW_SWIFTSHADER: 1
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Versión de Playwright
        id: playwright
        run: echo "version=$(pnpm --filter @ventisca/web exec playwright --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      - name: Navegadores de prueba, en caché
        id: navegadores
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      # Las bibliotecas del sistema que pide Chromium no entran en la caché: se instalan siempre.
      - name: Navegadores de prueba
        run: |
          if [ "${{ steps.navegadores.outputs.cache-hit }}" = true ]; then
            pnpm --filter @ventisca/web exec playwright install-deps chromium
          else
            pnpm --filter @ventisca/web exec playwright install --with-deps chromium
          fi
      # Dos procesos, la mitad de los núcleos. Medido con tres (PR #32): cada prueba tarda más, porque se
      # disputan el procesador, y las más largas se acercan a su límite de 2 minutos.
      - name: E2E del juego, la parte de esta máquina
        working-directory: apps/web
        run: |
          archivos=$(node scripts/e2e-reparto.mjs ${{ matrix.maquina }} ${{ strategy.job-total }})
          echo "Esta máquina corre: $archivos"
          pnpm exec playwright test $archivos --project=juego --grep-invert @lento --workers=2
      # La del reinicio del servidor corta a todo el que esté conectado, así que corre sola, al final, en la
      # máquina que termina antes. Y pedida junto con las demás traería de vuelta la prueba lenta: Playwright
      # corre entero, sin los filtros de la línea de comandos, el proyecto del que otro depende.
      - name: E2E del reinicio del servidor
        working-directory: apps/web
        run: |
          if node scripts/e2e-reparto.mjs ${{ matrix.maquina }} ${{ strategy.job-total }} --reinicio; then
            pnpm exec playwright test --project reinicio --no-deps
          else
            echo "La prueba del reinicio corre en otra máquina."
          fi
      # Si una e2e falla, Playwright deja su traza y una captura: se suben para verlas después.
      - name: Evidencia de las e2e que fallaron
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: evidencia-e2e-${{ matrix.maquina }}
          path: apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 14

  # La verificación que GitHub exige para fusionar y la que Railway espera para desplegar. Conserva su
  # nombre de siempre, `ci`, y pasa cuando pasó todo lo que le tocaba a este evento: en un pull request,
  # lo rápido y las e2e de todas las máquinas; en main, lo rápido.
  ci:
    if: always()
    needs: [rapidas, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Pasó todo lo que tocaba
        env:
          RAPIDAS: ${{ needs.rapidas.result }}
          E2E: ${{ needs.e2e.result }}
          E2E_ESPERADO: ${{ github.event_name == 'pull_request' && 'success' || 'skipped' }}
        run: |
          echo "estilo, tipos, unitarias y build: $RAPIDAS"
          echo "e2e: $E2E (se espera $E2E_ESPERADO)"
          test "$RAPIDAS" = success
          test "$E2E" = "$E2E_ESPERADO"

  # La misma imagen que se despliega en Railway: se construye, arranca, migra y sirve el juego.
  docker:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ventisca
          POSTGRES_PASSWORD: ventisca
          POSTGRES_DB: ventisca
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ventisca -d ventisca"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t ventisca .
      - name: La imagen arranca, migra y responde
        run: |
          docker run -d --name app --network host \
            -e DATABASE_URL=postgres://ventisca:ventisca@localhost:5432/ventisca -e PORT=3000 \
            -e NODE_ENV=production -e APP_URL=http://localhost:3000 \
            -e SESSION_SECRET=solo-para-probar-la-imagen-en-la-ci-no-es-un-secreto ventisca
          for i in $(seq 1 30); do curl -fsS localhost:3000/api/health && break; sleep 1; done
          curl -fsS localhost:3000/api/health | grep -q '"db":"ok"'
          curl -fsS localhost:3000/ | grep -q '<title>Ventisca</title>'
      - name: Registros del contenedor
        if: always()
        run: docker logs app
