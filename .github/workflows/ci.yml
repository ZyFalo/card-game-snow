name: CI

# En main corre en cada push (Railway espera este resultado antes de desplegar: "Wait for CI");
# en las demás ramas, a través de su pull request, para no correr todo dos veces.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    # Postgres para las pruebas del servidor: cada corrida crea y borra su propia base temporal.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ventisca
          POSTGRES_PASSWORD: ventisca
          POSTGRES_DB: ventisca
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ventisca -d ventisca"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL_TEST: postgres://ventisca:ventisca@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec biome ci .
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Prueba de humo e2e
        run: |
          pnpm --filter @ventisca/web exec playwright install --with-deps chromium
          PW_SWIFTSHADER=1 pnpm --filter @ventisca/web exec playwright test --grep-invert @lento

  # La misma imagen que se despliega en Railway: se construye, arranca, migra y sirve el juego.
  docker:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ventisca
          POSTGRES_PASSWORD: ventisca
          POSTGRES_DB: ventisca
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ventisca -d ventisca"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t ventisca .
      - name: La imagen arranca, migra y responde
        run: |
          docker run -d --name app --network host \
            -e DATABASE_URL=postgres://ventisca:ventisca@localhost:5432/ventisca -e PORT=3000 \
            -e NODE_ENV=production -e APP_URL=http://localhost:3000 \
            -e SESSION_SECRET=solo-para-probar-la-imagen-en-la-ci-no-es-un-secreto ventisca
          for i in $(seq 1 30); do curl -fsS localhost:3000/api/health && break; sleep 1; done
          curl -fsS localhost:3000/api/health | grep -q '"db":"ok"'
          curl -fsS localhost:3000/ | grep -q '<title>Ventisca</title>'
      - name: Registros del contenedor
        if: always()
        run: docker logs app
